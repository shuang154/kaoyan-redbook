<!DOCTYPE html>
<html lang="zh-CN" class="antialiased">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>考研英语红宝书 · 词汇精研</title>

  <!-- Fonts: Newsreader for Editorial English Headwords & Quotes, Noto Serif SC for Crisp Chinese -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,500&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', '"PingFang SC"', '"Microsoft YaHei"', 'sans-serif'],
            serif: ['Newsreader', 'Georgia', '"Times New Roman"', 'serif'],
            cnserif: ['"Noto Serif SC"', 'Georgia', 'serif'],
          },
          colors: {
            paper: {
              bg: '#FAF9F6',
              card: '#FFFFFF',
              border: '#E7E2D8',
              subtle: '#F3EFE6',
            },
            crimson: {
              50: '#FEF2F2',
              100: '#FEE2E2',
              200: '#FECACA',
              400: '#F87171',
              500: '#EF4444',
              600: '#DC2626',
              700: '#B91C1C',
              800: '#991B1B',
              900: '#7F1D1D',
            },
            ink: {
              primary: '#1C1917',
              muted: '#57534E',
            }
          },
          boxShadow: {
            'card': '0 1px 2px rgba(28, 25, 23, 0.04), 0 4px 12px rgba(28, 25, 23, 0.03)',
            'card-hover': '0 6px 18px rgba(28, 25, 23, 0.07), 0 1px 3px rgba(28, 25, 23, 0.04)',
          }
        }
      }
    };
  </script>

  <style>
    /* Custom Subtle Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(120, 113, 108, 0.28);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(120, 113, 108, 0.48);
    }

    /* Frosted-Glass Self-Test Mask Pill */
    .mask-active {
      position: relative;
      cursor: pointer;
      user-select: none;
      border-radius: 0.5rem;
    }
    .mask-active .mask-content {
      filter: blur(7px);
      opacity: 0.18;
      transition: filter 0.18s ease, opacity 0.18s ease;
    }
    .mask-active::after {
      content: attr(data-mask-label);
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0 0.7rem;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: #991B1B;
      background: linear-gradient(90deg, rgba(185, 28, 28, 0.09), rgba(185, 28, 28, 0.03));
      backdrop-filter: blur(3px);
      border: 1px dashed rgba(185, 28, 28, 0.34);
      border-radius: 0.5rem;
      transition: opacity 0.18s ease;
      pointer-events: none;
    }
    .dark .mask-active::after {
      color: #FCA5A5;
      background: linear-gradient(90deg, rgba(248, 113, 113, 0.16), rgba(248, 113, 113, 0.05));
      border-color: rgba(248, 113, 113, 0.36);
    }
    .mask-active:hover .mask-content,
    .mask-active.revealed .mask-content {
      filter: blur(0);
      opacity: 1;
    }
    .mask-active:hover::after,
    .mask-active.revealed::after {
      opacity: 0;
    }

    /* 3D Flashcard Flip */
    .perspective-1200 {
      perspective: 1200px;
    }
    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.52s cubic-bezier(0.22, 1, 0.36, 1);
      transform-style: preserve-3d;
    }
    .flashcard-inner.is-flipped {
      transform: rotateY(180deg);
    }
    .flashcard-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .flashcard-back {
      transform: rotateY(180deg);
    }

    /* Highlight Target Word & Inflections inside Exam Examples */
    .word-hl {
      color: #B91C1C;
      font-weight: 700;
      background-color: rgba(185, 28, 28, 0.09);
      padding: 0.04rem 0.26rem;
      border-radius: 0.25rem;
      border-bottom: 1.5px solid rgba(185, 28, 28, 0.38);
    }
    .dark .word-hl {
      color: #FCA5A5;
      background-color: rgba(248, 113, 113, 0.18);
      border-bottom-color: rgba(248, 113, 113, 0.48);
    }

    /* Audio Playing Animation */
    @keyframes soundPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.14); }
    }
    .speaking-pulse {
      animation: soundPulse 0.65s ease-in-out infinite;
    }
  </style>
</head>

<body class="bg-paper-bg text-ink-primary dark:bg-slate-900 dark:text-slate-100 font-sans min-h-screen transition-colors duration-200 selection:bg-crimson-100 selection:text-crimson-900 dark:selection:bg-crimson-900/50 dark:selection:text-red-100">

  <!-- Mobile Sidebar Backdrop -->
  <div id="mobile-backdrop" class="fixed inset-0 bg-stone-950/45 backdrop-blur-[2px] z-40 hidden lg:hidden transition-opacity"></div>

  <!-- Main Responsive Layout -->
  <div class="flex min-h-screen max-w-[1600px] mx-auto">

    <!-- ==================== LEFT SIDEBAR (280px) ==================== -->
    <aside id="sidebar" class="fixed lg:sticky top-0 left-0 z-50 h-screen w-[280px] shrink-0 bg-paper-card dark:bg-slate-800 border-r border-paper-border dark:border-slate-700 flex flex-col transform -translate-x-full lg:translate-x-0 transition-transform duration-200 ease-out">

      <!-- Editorial Paper-Book Brand Header -->
      <div class="px-5 pt-5 pb-4 border-b border-paper-border dark:border-slate-700 space-y-3.5">
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-crimson-700 to-crimson-900 text-white flex items-center justify-center shadow-sm font-cnserif font-bold text-lg">
              红
            </div>
            <div>
              <h1 class="text-[16px] font-cnserif font-bold tracking-tight text-ink-primary dark:text-white leading-tight">考研英语红宝书</h1>
              <p id="dataset-subtitle" class="text-[11px] font-medium text-ink-muted dark:text-slate-400 mt-0.5">正在连接词库...</p>
            </div>
          </div>
          <!-- Mobile Close Drawer Button -->
          <button id="btn-close-sidebar" class="lg:hidden p-2 rounded-lg text-ink-muted hover:bg-paper-subtle dark:text-slate-400 dark:hover:bg-slate-700" aria-label="关闭目录">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>

        <!-- Global Mastery Progress -->
        <div class="p-3 rounded-xl bg-paper-subtle/75 dark:bg-slate-900/60 border border-paper-border dark:border-slate-700">
          <div class="flex items-center justify-between text-xs mb-1.5">
            <span class="font-medium text-ink-muted dark:text-slate-300">总掌握进度</span>
            <span id="global-progress-text" class="font-semibold text-crimson-700 dark:text-crimson-400 tabular-nums">0 / 0 (0%)</span>
          </div>
          <div class="w-full h-2 rounded-full bg-stone-200/90 dark:bg-slate-700 overflow-hidden">
            <div id="global-progress-bar" class="h-full rounded-full bg-gradient-to-r from-crimson-700 to-crimson-600 dark:from-crimson-500 dark:to-crimson-400 transition-all duration-500" style="width: 0%"></div>
          </div>
        </div>
      </div>

      <!-- Quick Smart Virtual Views -->
      <div class="px-3 pt-3 pb-2 space-y-1">
        <button data-nav-view="NOTEBOOK" class="nav-item w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium transition-colors text-ink-primary dark:text-slate-200 hover:bg-paper-subtle dark:hover:bg-slate-700/70">
          <span class="flex items-center gap-2.5">
            <svg class="w-4 h-4 text-amber-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            <span>全部生词本</span>
          </span>
          <span id="badge-notebook-count" class="text-xs px-2 py-0.5 rounded-full bg-amber-100/90 text-amber-800 dark:bg-amber-500/20 dark:text-amber-300 font-semibold tabular-nums">0</span>
        </button>

        <button data-nav-view="UNMASTERED" class="nav-item w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium transition-colors text-ink-primary dark:text-slate-200 hover:bg-paper-subtle dark:hover:bg-slate-700/70">
          <span class="flex items-center gap-2.5">
            <svg class="w-4 h-4 text-crimson-700 dark:text-crimson-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
            <span>未掌握词库</span>
          </span>
          <span id="badge-unmastered-count" class="text-xs px-2 py-0.5 rounded-full bg-paper-subtle text-ink-muted dark:bg-slate-700 dark:text-slate-300 font-semibold tabular-nums">0</span>
        </button>
      </div>

      <div class="px-5 py-1.5">
        <div class="border-t border-paper-border dark:border-slate-700"></div>
      </div>

      <!-- Auto-Grouped Collapsible Unit Navigation -->
      <nav id="unit-nav-container" class="flex-1 overflow-y-auto px-3 pb-4 space-y-2">
        <!-- Dynamically rendered from ./api/meta -->
      </nav>

      <!-- Sidebar Footer: Cloud Sync Status, Dark Mode, Export/Import -->
      <div class="p-3.5 border-t border-paper-border dark:border-slate-700 bg-paper-subtle/60 dark:bg-slate-900/50 space-y-2">
        <div class="grid grid-cols-2 gap-2">
          <button id="btn-export-progress" class="flex items-center justify-center gap-1.5 px-2.5 py-2 rounded-xl text-xs font-medium bg-paper-card dark:bg-slate-800 border border-paper-border dark:border-slate-700 text-ink-muted dark:text-slate-300 hover:border-crimson-700/50 hover:text-crimson-700 dark:hover:text-crimson-400 transition-colors">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            <span>导出进度</span>
          </button>
          <label class="flex items-center justify-center gap-1.5 px-2.5 py-2 rounded-xl text-xs font-medium bg-paper-card dark:bg-slate-800 border border-paper-border dark:border-slate-700 text-ink-muted dark:text-slate-300 hover:border-crimson-700/50 hover:text-crimson-700 dark:hover:text-crimson-400 cursor-pointer transition-colors">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
            <span>导入进度</span>
            <input id="input-progress-upload" type="file" accept=".json,application/json" class="hidden" />
          </label>
        </div>

        <button id="btn-theme-toggle" class="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-xl text-xs font-medium bg-paper-card dark:bg-slate-800 border border-paper-border dark:border-slate-700 text-ink-primary dark:text-slate-200 hover:border-stone-400 dark:hover:border-slate-500 transition-colors">
          <svg class="w-3.5 h-3.5 hidden dark:block text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          <svg class="w-3.5 h-3.5 block dark:hidden text-ink-muted" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
          <span id="theme-label">切换深色模式</span>
        </button>

        <!-- Clean Cloud Sync Status Pill -->
        <div class="flex items-center justify-center pt-0.5">
          <div id="sync-status-pill" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-medium bg-paper-card/90 dark:bg-slate-800 border border-paper-border dark:border-slate-700 text-ink-muted dark:text-slate-300">
            <span id="sync-status-dot" class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
            <span id="sync-status-text">同步中...</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- ==================== MAIN STUDY AREA ==================== -->
    <main class="flex-1 min-w-0 flex flex-col">

      <!-- Sticky Top Study Toolbar -->
      <header class="sticky top-0 z-30 bg-paper-bg/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-paper-border dark:border-slate-700">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3 space-y-2.5">

          <!-- Row 1: Mobile Menu, Unit Title + Prev/Next Arrows, View Mode Switcher -->
          <div class="flex flex-wrap items-center justify-between gap-2.5">
            <div class="flex items-center gap-2 min-w-0">
              <button id="btn-open-sidebar" class="lg:hidden p-2 -ml-1 rounded-xl bg-paper-card dark:bg-slate-800 border border-paper-border dark:border-slate-700 text-ink-primary dark:text-slate-200" aria-label="打开侧边栏">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
              </button>

              <div class="flex items-center gap-2 min-w-0">
                <h2 id="current-view-title" class="text-lg sm:text-xl font-cnserif font-bold tracking-tight text-ink-primary dark:text-white truncate">加载中...</h2>
                <span id="current-view-stats" class="shrink-0 text-xs font-semibold px-2.5 py-0.5 rounded-full bg-crimson-50 text-crimson-700 dark:bg-crimson-900/40 dark:text-crimson-400 tabular-nums">0 词</span>
              </div>

              <!-- Quick Prev / Next Unit Arrows -->
              <div id="unit-quick-arrows" class="hidden sm:flex items-center gap-1 ml-1">
                <button id="btn-prev-unit" title="上一单元" class="p-1.5 rounded-lg border border-paper-border dark:border-slate-700 bg-paper-card dark:bg-slate-800 text-ink-muted dark:text-slate-300 hover:text-crimson-700 dark:hover:text-crimson-400 hover:border-crimson-700/40 disabled:opacity-35 disabled:pointer-events-none transition-colors">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
                </button>
                <button id="btn-next-unit" title="下一单元" class="p-1.5 rounded-lg border border-paper-border dark:border-slate-700 bg-paper-card dark:bg-slate-800 text-ink-muted dark:text-slate-300 hover:text-crimson-700 dark:hover:text-crimson-400 hover:border-crimson-700/40 disabled:opacity-35 disabled:pointer-events-none transition-colors">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                </button>
              </div>
            </div>

            <!-- 3 Study View Mode Buttons -->
            <div class="flex items-center gap-1 bg-paper-subtle dark:bg-slate-800 p-1 rounded-xl border border-paper-border dark:border-slate-700">
              <button id="mode-card" class="view-mode-btn px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm0 10a2 2 0 012-2h12a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2z"/></svg>
                <span>卡片视图</span>
              </button>
              <button id="mode-list" class="view-mode-btn px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
                <span>速刷列表</span>
              </button>
              <button id="btn-open-flashcard" class="px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-semibold bg-crimson-700 hover:bg-crimson-800 text-white shadow-sm transition-all flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                <span>闪卡模式</span>
              </button>
            </div>
          </div>

          <!-- Row 2: Global Search + Self-Test Masks + Voice Accent -->
          <div class="flex flex-col md:flex-row items-stretch md:items-center gap-2">
            <!-- Global Search -->
            <div class="relative flex-1 flex items-center bg-paper-card dark:bg-slate-800 border border-paper-border dark:border-slate-700 rounded-xl focus-within:ring-2 focus-within:ring-crimson-700/20 focus-within:border-crimson-700 dark:focus-within:border-crimson-400 transition-all">
              <svg class="w-4 h-4 text-ink-muted dark:text-slate-400 ml-3 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
              <input id="search-input" type="text" placeholder="全局搜索英文单词或中文释义..." class="w-full bg-transparent px-2.5 py-2 text-sm text-ink-primary dark:text-slate-100 placeholder-stone-400 dark:placeholder-slate-500 focus:outline-none" />
              <svg id="search-spinner" class="hidden w-4 h-4 mr-2 animate-spin text-crimson-700 dark:text-crimson-400 shrink-0" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
              </svg>
              <button id="btn-clear-search" class="hidden p-1.5 mr-1 text-stone-400 hover:text-ink-primary dark:hover:text-slate-200 rounded-lg" aria-label="清除搜索">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
              </button>
            </div>

            <!-- Self-Test Mask & Voice Accent Toggles -->
            <div class="flex flex-wrap items-center gap-1.5">
              <button id="btn-mask-meaning" class="px-3 py-2 rounded-xl text-xs font-semibold border border-paper-border dark:border-slate-700 bg-paper-card dark:bg-slate-800 text-ink-primary dark:text-slate-200 hover:border-crimson-700/50 transition-all flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
                <span>遮挡释义</span>
              </button>

              <button id="btn-mask-word" class="px-3 py-2 rounded-xl text-xs font-semibold border border-paper-border dark:border-slate-700 bg-paper-card dark:bg-slate-800 text-ink-primary dark:text-slate-200 hover:border-crimson-700/50 transition-all flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"/></svg>
                <span>遮挡单词</span>

      /* =====================================================================

      function escapeHtml(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function escapeRegex(str) {
        return String(str).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      }

      function naturalCompare(a, b) {
        const re = /(\d+)|(\D+)/g;
        const pa = String(a).match(re) || [];
        const pb = String(b).match(re) || [];
        const len = Math.max(pa.length, pb.length);
        for (let i = 0; i < len; i++) {
          if (pa[i] === undefined) return -1;
          if (pb[i] === undefined) return 1;
          const na = /^\d+$/.test(pa[i]) ? parseInt(pa[i], 10) : null;
          const nb = /^\d+$/.test(pb[i]) ? parseInt(pb[i], 10) : null;
          if (na !== null && nb !== null) {
            if (na !== nb) return na - nb;
          } else {
            const cmp = pa[i].localeCompare(pb[i], 'zh-CN');
            if (cmp !== 0) return cmp;
          }
        }
        return 0;
      }

      function splitUnitPage(pageName) {
        const match = String(pageName).match(/^(.*?)\s*(Unit\s*\d+.*)$/i);
        if (match) {
          const group = match[1].trim() || '词汇单元';
          const rawUnit = match[2].trim().replace(/^unit\s*/i, 'Unit ');
          return { group, label: rawUnit };
        }
        return { group: '词库分类', label: pageName };
      }

        'v.': 'bg-crimson-50 text-crimson-700 border-crimson-200 dark:bg-crimson-900/35 dark:text-crimson-300 dark:border-crimson-800',

        'prep.': 'bg-amber-50 text-amber-800 border-amber-200 dark:bg-amber-900/35 dark:text-amber-300 dark:border-amber-800',

      function formatMeaningWithPOS(rawMeaning) {
        const safe = escapeHtml(rawMeaning || '暂无释义');
        // Match common POS tags like n. vt. vi. adj. adv. prep. conj. pron. det. vlink. suff. v.
        const posRegex = /\b(vlink|prep|conj|pron|suff|adj|adv|det|vt|vi|v|n)\./gi;
        return safe.replace(posRegex, (match) => {
          const key = match.toLowerCase();
          const cls = POS_COLORS[key] || 'bg-stone-100 text-stone-700 border-stone-200 dark:bg-slate-700 dark:text-slate-300 dark:border-slate-600';
          return `<span class="inline-block font-serif italic font-semibold text-[11px] leading-none px-1.5 py-0.5 mr-1 rounded border align-baseline ${cls}">${match}</span>`;
        });
      }

      /**
       * Automatically highlights the target word and common English inflections
       * (-s, -es, -ed, -ing, -er, -est, -ly, -ied, -ies, doubled consonant, dropped -e).
       */
      function highlightWordInSentence(sentence, targetWord) {
        const safeText = escapeHtml(sentence || '');
        const cleanWord = String(targetWord || '').trim();
        if (!cleanWord) return safeText;

        const forms = new Set([escapeRegex(cleanWord)]);
        const lower = cleanWord.toLowerCase();

        // Standard inflection stem rules
        if (/^[a-zA-Z]+$/.test(lower) && lower.length >= 3) {
          // Base + common suffixes
          forms.add(escapeRegex(lower) + '(?:s|es|ed|ing|er|est|ly|al|ally)?');

          // Ends with -e (e.g. restore -> restoring, restored)
          if (lower.endsWith('e') && lower.length > 3) {
            const stem = escapeRegex(lower.slice(0, -1));
            forms.add(stem + '(?:ing|ed|er|est|s|d)');
          }
          // Ends with -y (e.g. quality -> qualities, carry -> carried)
          if (lower.endsWith('y') && lower.length > 3) {
            const stem = escapeRegex(lower.slice(0, -1));
            forms.add(stem + '(?:ies|ied|ier|iest|ily)');
          }
          // Doubled final consonant (e.g. plan -> planned, planning)
          const lastChar = lower[lower.length - 1];
          if (/[bcdfgklmnprstvz]/.test(lastChar)) {
            forms.add(escapeRegex(lower + lastChar) + '(?:ed|ing|er|est)');
          }
          // Ends with -ic (e.g. practical -> practically, classic -> classically)
          if (lower.endsWith('ic')) {
            forms.add(escapeRegex(lower) + 'ally');
          }
          // Ends with -al (e.g. practical -> practically)
          if (lower.endsWith('al')) {
            forms.add(escapeRegex(lower) + 'ly');
          }
        }

        try {
          const pattern = new RegExp(`\\b(${Array.from(forms).join('|')})\\b`, 'gi');
          return safeText.replace(pattern, '<span class="word-hl">$1</span>');
        } catch {
          return safeText;
        }
      }

      /* =====================================================================

      function speakText(text, triggerBtn = null) {
        if (!('speechSynthesis' in window)) {
          showToast('当前浏览器不支持语音朗读', 'error');
          return;
        }
        try {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(String(text || ''));
          utter.lang = state.settings.accent || 'en-US';
          utter.rate = text.includes(' ') ? 0.96 : 0.92;

          if (triggerBtn) {
            triggerBtn.classList.add('speaking-pulse', 'text-crimson-700', 'dark:text-crimson-400');
            const cleanup = () => triggerBtn.classList.remove('speaking-pulse', 'text-crimson-700', 'dark:text-crimson-400');
            utter.onend = cleanup;
            utter.onerror = cleanup;
          }
          window.speechSynthesis.speak(utter);
        } catch (err) {
          console.error('Speech error:', err);
        }
      }

      /* =====================================================================
       * 7. BACKEND API LAYER (Relative ./api/... + Offline Fallback)
       * ===================================================================== */
      function saveOfflineState() {
        try {
          localStorage.setItem(LOCAL_FALLBACK_KEY, JSON.stringify({
            mastered: Array.from(state.mastered),
            notebook: Array.from(state.notebook),
            settings: state.settings,
          }));
        } catch (e) {
          console.warn('localStorage write failed:', e);
        }
      }

      function loadOfflineState() {
        try {
          const raw = localStorage.getItem(LOCAL_FALLBACK_KEY);
          if (!raw) return { mastered: [], notebook: [], settings: {} };
          return JSON.parse(raw);
        } catch {
          return { mastered: [], notebook: [], settings: {} };
        }
      }

      function buildOfflineMeta() {
        const grouped = new Map();
        for (const item of SAMPLE_WORDS) {
          if (!grouped.has(item.page)) grouped.set(item.page, []);
          grouped.get(item.page).push(item);
        }
        const units = Array.from(grouped.entries()).map(([page, list]) => {
          state.unitCache.set(page, list);
          return { page, count: list.length, words: list.map((w) => w.word) };
        });
        return {
          version: 'offline-sample',
          total_words: SAMPLE_WORDS.length,
          total_units: units.length,
          units,
        };
      }

      async function apiFetchJson(url, options = {}) {
        const res = await fetch(url, {
          headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
          ...options,
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
      }

      async function apiLoadInitial() {
        updateSyncIndicator('syncing');
        try {
          const [meta, progress] = await Promise.all([
            apiFetchJson('./api/meta'),
            apiFetchJson('./api/progress'),
          ]);
          state.offlineMode = false;
          state.meta = meta;
          state.mastered = new Set(progress.mastered || []);
          state.notebook = new Set(progress.notebook || []);
          state.settings = {
            darkMode: Boolean(progress.settings?.darkMode),
            lastUnit: progress.settings?.lastUnit || null,
            accent: progress.settings?.accent || 'en-US',
          };
          els.offlineBanner.classList.add('hidden');
          updateSyncIndicator('synced');
        } catch (err) {
          console.info('Backend unreachable, entering offline preview mode:', err.message);
          state.offlineMode = true;
          state.meta = buildOfflineMeta();
          const saved = loadOfflineState();
          state.mastered = new Set(saved.mastered || []);
          state.notebook = new Set(saved.notebook || []);
          state.settings = {
            darkMode: Boolean(saved.settings?.darkMode),
            lastUnit: saved.settings?.lastUnit || null,
            accent: saved.settings?.accent || 'en-US',
          };
          els.offlineBanner.classList.remove('hidden');
          updateSyncIndicator('offline');
        }

        // Preserve sorted unit order from meta
        state.unitOrder = (state.meta.units || []).map((u) => u.page);
      }

      async function apiFetchUnit(unitName) {
        if (state.unitCache.has(unitName)) {
          return state.unitCache.get(unitName);
        }
        if (state.offlineMode) {
          const list = SAMPLE_WORDS.filter((w) => w.page === unitName);
          state.unitCache.set(unitName, list);
          return list;
        }
        const words = await apiFetchJson(`./api/unit/${encodeURIComponent(unitName)}`);
        state.unitCache.set(unitName, words);
        return words;
      }

      function scheduleNextUnitPrefetch(currentUnitName) {
        const idx = state.unitOrder.indexOf(currentUnitName);
        if (idx === -1 || idx + 1 >= state.unitOrder.length) return;
        const nextUnit = state.unitOrder[idx + 1];
        if (state.unitCache.has(nextUnit) || state.prefetching.has(nextUnit) || state.offlineMode) return;

        const doPrefetch = () => {
          if (state.unitCache.has(nextUnit) || state.prefetching.has(nextUnit)) return;
          state.prefetching.add(nextUnit);
          apiFetchUnit(nextUnit)
            .catch(() => {})
            .finally(() => state.prefetching.delete(nextUnit));
        };

        if (typeof window.requestIdleCallback === 'function') {
          window.requestIdleCallback(doPrefetch, { timeout: 2500 });
        } else {
          setTimeout(doPrefetch, 900);
        }
      }

      async function apiFetchWordsByList(wordKeys) {
        if (!wordKeys.length) return { total: 0, words: [] };
        if (state.offlineMode) {
          const keySet = new Set(wordKeys.map((w) => w.toLowerCase()));
          const matched = SAMPLE_WORDS.filter((item) => keySet.has(item.word.toLowerCase()));
          return { total: matched.length, words: matched };
        }
        return await apiFetchJson('./api/words', {
          method: 'POST',
          body: JSON.stringify({ words: wordKeys }),
        });
      }

      async function apiSearch(q) {
        if (state.offlineMode) {
          const low = q.trim().toLowerCase();
          const matched = SAMPLE_WORDS.filter(
            (item) => item.word.toLowerCase().includes(low) || item.meaning.toLowerCase().includes(low)
          );
          return { query: q, total: matched.length, results: matched };
        }
        return await apiFetchJson(`./api/search?q=${encodeURIComponent(q)}&limit=60`);
      }

      async function apiTranslate(text) {
        const key = String(text || '').trim();
        if (!key) return '';
        if (state.offlineMode) return '';
        if (translationCache.has(key)) return translationCache.get(key);

        const data = await apiFetchJson(`./api/translate?q=${encodeURIComponent(key)}&sl=en&tl=zh-CN`);
        const t = data.translation || '';
        translationCache.set(key, t);
        return t;
      }

      // 只翻译当前已展开的例句占位元素，避免未展开时产生任何请求
      function translateVisibleExamples() {
        const nodes = els.wordListRoot.querySelectorAll('[data-translate-src]:not([data-translated])');
        nodes.forEach((node) => {
          const src = node.dataset.translateSrc;
          if (!src) return;
          node.dataset.translated = '1';

          let p = translationPending.get(src);
          if (!p) {
            p = apiTranslate(src).catch(() => '');
            translationPending.set(src, p);
            p.finally(() => translationPending.delete(src));
          }
          p.then((t) => {
            if (t) node.textContent = t;
            else node.remove();
          });
        });
      }

      async function apiToggleProgress(word, type, value) {
        if (state.offlineMode) {
          saveOfflineState();
          return;
        }
        state.pendingSyncs++;
        updateSyncIndicator('syncing');
        try {
          await apiFetchJson('./api/progress/toggle', {
            method: 'POST',
            body: JSON.stringify({ word, type, value }),
          });
        } catch (err) {
          console.error('Toggle sync error:', err);
          updateSyncIndicator('error');
          showToast('云端同步失败，请检查网络连接', 'error');
          return;
        } finally {
          state.pendingSyncs = Math.max(0, state.pendingSyncs - 1);
          if (state.pendingSyncs === 0 && !state.offlineMode) {
            updateSyncIndicator('synced');
          }
        }
      }

      async function apiSaveSettings(partial) {
        Object.assign(state.settings, partial);
        if (state.offlineMode) {
          saveOfflineState();
          return;
        }
        state.pendingSyncs++;
        updateSyncIndicator('syncing');
        try {
          await apiFetchJson('./api/settings', {
            method: 'POST',
            body: JSON.stringify(partial),
          });
        } catch (err) {
          console.error('Settings sync error:', err);
          updateSyncIndicator('error');
          return;
        } finally {
          state.pendingSyncs = Math.max(0, state.pendingSyncs - 1);
          if (state.pendingSyncs === 0 && !state.offlineMode) {
            updateSyncIndicator('synced');
          }
        }
      }

      async function apiBatchImport(masteredArr, notebookArr) {
        if (state.offlineMode) {
          masteredArr.forEach((w) => state.mastered.add(w));
          notebookArr.forEach((w) => state.notebook.add(w));
          saveOfflineState();
          return;
        }
        state.pendingSyncs++;
        updateSyncIndicator('syncing');
        try {
          const res = await apiFetchJson('./api/progress/batch', {
            method: 'POST',
            body: JSON.stringify({
              mastered: masteredArr,
              notebook: notebookArr,
              mode: 'merge',
            }),
          });
          state.mastered = new Set(res.mastered || []);
          state.notebook = new Set(res.notebook || []);
        } finally {
          state.pendingSyncs = Math.max(0, state.pendingSyncs - 1);
          if (state.pendingSyncs === 0 && !state.offlineMode) {
            updateSyncIndicator('synced');
          }
        }
      }

       * 8. THEME & TOOLBAR UI UPDATES
       * ===================================================================== */
      function applyTheme() {
        const isDark = Boolean(state.settings.darkMode);
        document.documentElement.classList.toggle('dark', isDark);
        els.themeLabel.textContent = isDark ? '切换纸质浅色' : '切换深色模式';
      }

      function updateToolbarControls() {
        // View Mode buttons
        const activeBtnCls = 'bg-paper-card dark:bg-slate-700 text-crimson-700 dark:text-crimson-400 shadow-sm';
        const idleBtnCls = 'text-ink-muted dark:text-slate-400 hover:text-ink-primary dark:hover:text-slate-200';
        els.modeCard.className = `view-mode-btn px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 ${state.viewMode === 'card' ? activeBtnCls : idleBtnCls}`;
        els.modeList.className = `view-mode-btn px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 ${state.viewMode === 'list' ? activeBtnCls : idleBtnCls}`;

        // Mask buttons
        const applyToggleStyle = (btn, active) => {
          if (active) {
            btn.className = 'px-3 py-2 rounded-xl text-xs font-semibold border border-crimson-700 dark:border-crimson-500 bg-crimson-50 dark:bg-crimson-900/40 text-crimson-700 dark:text-crimson-300 transition-all flex items-center gap-1.5';
          } else {
            btn.className = 'px-3 py-2 rounded-xl text-xs font-semibold border border-paper-border dark:border-slate-700 bg-paper-card dark:bg-slate-800 text-ink-primary dark:text-slate-200 hover:border-crimson-700/50 transition-all flex items-center gap-1.5';
          }
        };
        applyToggleStyle(els.btnMaskMeaning, state.maskMeaning);
        applyToggleStyle(els.btnMaskWord, state.maskWord);

        // Accent label
        els.accentLabel.textContent = state.settings.accent === 'en-GB' ? '英音' : '美音';

        // Filter pills
        els.filterPills.querySelectorAll('.filter-pill').forEach((btn) => {
          const isCurrent = btn.dataset.filter === state.filter;
          btn.className = isCurrent
            ? 'filter-pill px-3 py-1 rounded-full text-xs font-semibold transition-all bg-crimson-700 text-white shadow-sm'
            : 'filter-pill px-3 py-1 rounded-full text-xs font-semibold transition-all bg-paper-subtle dark:bg-slate-800 text-ink-muted dark:text-slate-300 hover:bg-stone-200/80 dark:hover:bg-slate-700';
        });

        // Expand/collapse all examples label
        els.toggleAllExamplesLabel.textContent = state.allExamplesExpanded ? '收起本页例句' : '展开本页例句';
        els.btnToggleAllExamples.classList.toggle('hidden', state.viewMode !== 'card');
      }

      /* =====================================================================
       * 9. SIDEBAR & PROGRESS RENDERING (Using Lightweight ./api/meta)
       * ===================================================================== */
      function renderSidebarAndProgress() {
        if (!state.meta) return;
        const units = state.meta.units || [];
        const totalWords = state.meta.total_words || 0;
        const totalUnits = state.meta.total_units || units.length;

        // Calculate global stats accurately from meta.units
        let masteredCount = 0;
        const allWordSet = new Set();
        for (const u of units) {
          for (const w of u.words) {
            if (!allWordSet.has(w)) {
              allWordSet.add(w);
              if (state.mastered.has(w)) masteredCount++;
            }
          }
        }
        const effectiveTotal = allWordSet.size || totalWords;
        const pct = effectiveTotal > 0 ? Math.round((masteredCount / effectiveTotal) * 100) : 0;

        els.datasetSubtitle.textContent = `共 ${totalWords} 词 · ${totalUnits} 个单元`;
        els.globalProgressText.textContent = `${masteredCount} / ${effectiveTotal} (${pct}%)`;
        els.globalProgressBar.style.width = `${pct}%`;

        els.badgeNotebook.textContent = state.notebook.size;
        els.badgeUnmastered.textContent = Math.max(0, effectiveTotal - masteredCount);

        // Highlight active quick views
        document.querySelectorAll('.nav-item[data-nav-view]').forEach((btn) => {
          const isActive = !state.searchQuery && state.activeView === btn.dataset.navView;
          btn.classList.toggle('bg-crimson-50', isActive);
          btn.classList.toggle('text-crimson-800', isActive);
          btn.classList.toggle('dark:bg-crimson-900/35', isActive);
          btn.classList.toggle('dark:text-crimson-300', isActive);
        });

        // Group units by category prefix before "Unit"
        const groups = new Map();
        for (const u of units) {
          const { group, label } = splitUnitPage(u.page);
          if (!groups.has(group)) groups.set(group, []);
          groups.get(group).push({ ...u, label });
        }

        const htmlParts = [];
        for (const [groupName, groupUnits] of groups.entries()) {
          groupUnits.sort((a, b) => naturalCompare(a.page, b.page));
          const isCollapsed = state.collapsedGroups.has(groupName);
          const groupTotal = groupUnits.reduce((acc, u) => acc + u.count, 0);

          htmlParts.push(`
            <div class="rounded-xl overflow-hidden">
              <button data-toggle-group="${escapeHtml(groupName)}" class="w-full flex items-center justify-between px-2.5 py-2 text-xs font-bold tracking-wide text-ink-muted dark:text-slate-400 hover:text-ink-primary dark:hover:text-slate-200 transition-colors">
                <span class="flex items-center gap-1.5">
                  <svg class="w-3.5 h-3.5 transition-transform duration-150 ${isCollapsed ? '-rotate-90' : ''}" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                  <span>${escapeHtml(groupName)}</span>
                </span>
                <span class="text-[11px] font-medium opacity-75 tabular-nums">${groupUnits.length} 单元 · ${groupTotal} 词</span>
              </button>
              <div class="${isCollapsed ? 'hidden' : 'space-y-1 mt-0.5 pl-1'}">
                ${groupUnits.map((u) => {
                  const uMastered = u.words.reduce((c, w) => c + (state.mastered.has(w) ? 1 : 0), 0);
                  const uPct = u.count > 0 ? Math.round((uMastered / u.count) * 100) : 0;
                  const isActive = !state.searchQuery && state.activeView === u.page;
                  const doneAll = u.count > 0 && uMastered === u.count;
                  return `
                    <button data-select-unit="${escapeHtml(u.page)}" class="w-full text-left px-3 py-2 rounded-xl transition-all ${
                      isActive
                        ? 'bg-crimson-50 dark:bg-crimson-900/35 border border-crimson-200 dark:border-crimson-800/70'
                        : 'border border-transparent hover:bg-paper-subtle dark:hover:bg-slate-700/60'
                    }">
                      <div class="flex items-center justify-between gap-2 text-[13px] mb-1">
                        <span class="font-medium truncate ${isActive ? 'text-crimson-800 dark:text-crimson-300 font-semibold' : 'text-ink-primary dark:text-slate-200'}">
                          ${escapeHtml(u.label)}
                        </span>
                        <span class="text-[11px] tabular-nums shrink-0 ${doneAll ? 'text-emerald-600 dark:text-emerald-400 font-semibold' : 'text-ink-muted dark:text-slate-400'}">
                          ${uMastered}/${u.count}
                        </span>
                      </div>
                      <div class="w-full h-1 rounded-full bg-stone-200/80 dark:bg-slate-700 overflow-hidden">
                        <div class="h-full rounded-full transition-all duration-300 ${doneAll ? 'bg-emerald-500' : 'bg-crimson-700 dark:bg-crimson-400'}" style="width: ${uPct}%"></div>
                      </div>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          `);
        }

        els.unitNavContainer.innerHTML = htmlParts.join('');
      }

      /* =====================================================================
       * 10. VIEW LOADING & NAVIGATION (On-Demand + Next-Unit Prefetch)
       * ===================================================================== */
      function renderLoadingSkeleton() {
        els.wordListRoot.innerHTML = `
          <div class="space-y-4">
            ${Array.from({ length: 5 }).map(() => `
              <div class="bg-paper-card dark:bg-slate-800 border border-paper-border dark:border-slate-700 rounded-2xl p-5 animate-pulse space-y-3">
                <div class="flex items-center justify-between">
                  <div class="h-7 w-40 bg-paper-subtle dark:bg-slate-700 rounded-lg"></div>
                  <div class="h-7 w-24 bg-paper-subtle dark:bg-slate-700 rounded-lg"></div>
                </div>
                <div class="h-4 w-3/4 bg-paper-subtle dark:bg-slate-700 rounded"></div>
                <div class="h-4 w-1/2 bg-paper-subtle dark:bg-slate-700 rounded"></div>
              </div>
            `).join('')}
          </div>
        `;
      }

      async function openUnit(unitName, persistLastUnit = true) {
        state.activeView = unitName;
        state.searchQuery = '';
        state.searchResults = null;
        els.searchInput.value = '';
        els.btnClearSearch.classList.add('hidden');
        state.allExamplesExpanded = false;
        state.expandedDrawers.clear();
        els.loadMoreContainer.classList.add('hidden');

        closeMobileSidebar();
        renderSidebarAndProgress();
        updateToolbarControls();

        if (!state.unitCache.has(unitName)) {
          state.isLoadingView = true;
          els.currentViewTitle.textContent = unitName;
          els.currentViewStats.textContent = '加载中...';
          renderLoadingSkeleton();
        }

        try {
          const words = await apiFetchUnit(unitName);
          if (state.activeView !== unitName) return; // User switched away mid-flight
          state.currentWords = words;
          state.isLoadingView = false;
          renderMainContent();
          window.scrollTo({ top: 0, behavior: 'instant' });

          if (persistLastUnit && state.settings.lastUnit !== unitName) {
            apiSaveSettings({ lastUnit: unitName });
          }

          // Silently prefetch ONLY the next unit when browser is idle
          scheduleNextUnitPrefetch(unitName);
        } catch (err) {
          console.error('Unit load error:', err);
          state.isLoadingView = false;
          els.wordListRoot.innerHTML = `
            <div class="text-center py-16 bg-paper-card dark:bg-slate-800 rounded-2xl border border-paper-border dark:border-slate-700">
              <p class="text-crimson-700 dark:text-crimson-400 font-semibold">单元加载失败</p>
              <p class="text-xs text-ink-muted dark:text-slate-400 mt-1">${escapeHtml(err.message)}</p>
            </div>
          `;
        }
      }

      async function openNotebookView() {
        state.activeView = 'NOTEBOOK';
        state.searchQuery = '';
        state.searchResults = null;
        els.searchInput.value = '';
        els.btnClearSearch.classList.add('hidden');
        state.allExamplesExpanded = false;
        state.expandedDrawers.clear();
        els.loadMoreContainer.classList.add('hidden');

        closeMobileSidebar();
        renderSidebarAndProgress();
        updateToolbarControls();

        const keys = Array.from(state.notebook);
        if (!keys.length) {
          state.currentWords = [];
          renderMainContent();
          return;
        }

        state.isLoadingView = true;
        els.currentViewTitle.textContent = '全部生词本';
        els.currentViewStats.textContent = '加载中...';
        renderLoadingSkeleton();

        try {
          const res = await apiFetchWordsByList(keys);
          if (state.activeView !== 'NOTEBOOK') return;
          state.currentWords = res.words || [];
          state.isLoadingView = false;
          renderMainContent();
          window.scrollTo({ top: 0, behavior: 'instant' });
        } catch (err) {
          state.isLoadingView = false;
          showToast('生词本加载失败', 'error');
        }
      }

      async function openUnmasteredView() {
        state.activeView = 'UNMASTERED';
        state.searchQuery = '';
        state.searchResults = null;
        els.searchInput.value = '';
        els.btnClearSearch.classList.add('hidden');
        state.allExamplesExpanded = false;
        state.expandedDrawers.clear();

        closeMobileSidebar();
        renderSidebarAndProgress();
        updateToolbarControls();

        // Compute full list of unmastered word strings from meta.units
        const seen = new Set();
        const unmasteredKeys = [];
        for (const u of (state.meta?.units || [])) {
          for (const w of u.words) {
            if (!seen.has(w)) {
              seen.add(w);
              if (!state.mastered.has(w)) unmasteredKeys.push(w);
            }
          }
        }

        state.unmasteredAllKeys = unmasteredKeys;
        state.unmasteredOffset = 0;
        state.currentWords = [];

        if (!unmasteredKeys.length) {
          els.loadMoreContainer.classList.add('hidden');
          renderMainContent();
          return;
        }

        state.isLoadingView = true;
        els.currentViewTitle.textContent = '未掌握词库';
        els.currentViewStats.textContent = `共 ${unmasteredKeys.length} 词`;
        renderLoadingSkeleton();

        await loadNextUnmasteredChunk();
        window.scrollTo({ top: 0, behavior: 'instant' });
      }

      async function loadNextUnmasteredChunk() {
        const nextSlice = state.unmasteredAllKeys.slice(
          state.unmasteredOffset,
          state.unmasteredOffset + UNMASTERED_CHUNK_SIZE
        );
        if (!nextSlice.length) {
          els.loadMoreContainer.classList.add('hidden');
          return;
        }

        els.btnLoadMore.disabled = true;
        els.btnLoadMore.textContent = '加载中...';

        try {
          const res = await apiFetchWordsByList(nextSlice);
          if (state.activeView !== 'UNMASTERED') return;
          state.currentWords = state.currentWords.concat(res.words || []);
          state.unmasteredOffset += nextSlice.length;
          state.isLoadingView = false;
          renderMainContent();
        } catch (err) {
          state.isLoadingView = false;
          showToast('加载未掌握词条失败', 'error');
        } finally {
          els.btnLoadMore.disabled = false;
          const remaining = state.unmasteredAllKeys.length - state.unmasteredOffset;
          if (remaining > 0 && state.activeView === 'UNMASTERED' && !state.searchQuery) {
            els.loadMoreContainer.classList.remove('hidden');
            els.btnLoadMore.textContent = `加载更多（剩余 ${remaining} 词）`;
          } else {
            els.loadMoreContainer.classList.add('hidden');
          }
        }
      }

      /* =====================================================================
       * 11. WORD LIST / CARD RENDERING
       * ===================================================================== */
      function getVisibleWords() {
        const list = _getFilteredWords();
        if (state.sortMode === 'freq') {
          return [...list].sort((a, b) => (b.count || 0) - (a.count || 0));
        }
        if (state.sortMode === 'alpha') {
          return [...list].sort((a, b) => (a.word || '').localeCompare(b.word || ''));
        }
        if (state.sortMode === 'shuffle') {
          list.forEach((item) => {
            if (!state.shuffleMap.has(item.word)) {
              state.shuffleMap.set(item.word, Math.random());
            }
          });
          return [...list].sort((a, b) => state.shuffleMap.get(a.word) - state.shuffleMap.get(b.word));
        }
        return list;
      }

      (function bindSortControls() {
        const sortEl = document.getElementById('sort-select');
        const shuffleBtn = document.getElementById('btn-shuffle');
        if (sortEl) {
          sortEl.addEventListener('change', (e) => {
            state.sortMode = e.target.value;
            if (state.sortMode === 'shuffle') state.shuffleMap.clear();
            renderMainContent();
          });
        }
        if (shuffleBtn) {
          shuffleBtn.addEventListener('click', () => {
            state.shuffleMap.clear();
            state.sortMode = 'shuffle';
            if (sortEl) sortEl.value = 'shuffle';
            renderMainContent();
          });
        }
      })();

      function _getFilteredWords() {
        const base = state.searchResults ? (state.searchResults.results || []) : state.currentWords;
        if (state.filter === 'unmastered') {
          return base.filter((w) => !state.mastered.has(w.word));
        }
        if (state.filter === 'notebook') {
          return base.filter((w) => state.notebook.has(w.word));
        }
        return base;
      }

      function updateUnitPrevNextControls() {
        const isUnitView = !state.searchResults && state.activeView && state.activeView !== 'NOTEBOOK' && state.activeView !== 'UNMASTERED';
        els.unitQuickArrows.classList.toggle('hidden', !isUnitView);
        els.unitQuickArrows.classList.toggle('sm:flex', isUnitView);
        els.unitFooterNav.classList.toggle('hidden', !isUnitView);

        if (!isUnitView) return;

        const idx = state.unitOrder.indexOf(state.activeView);
        const prevUnit = idx > 0 ? state.unitOrder[idx - 1] : null;
        const nextUnit = idx >= 0 && idx + 1 < state.unitOrder.length ? state.unitOrder[idx + 1] : null;

        els.btnPrevUnit.disabled = !prevUnit;
        els.btnNextUnit.disabled = !nextUnit;
        els.btnFooterPrev.disabled = !prevUnit;
        els.btnFooterNext.disabled = !nextUnit;

        els.footerPrevLabel.textContent = prevUnit ? `上一单元 · ${splitUnitPage(prevUnit).label}` : '已是第一单元';
        els.footerNextLabel.textContent = nextUnit ? `下一单元 · ${splitUnitPage(nextUnit).label}` : '已是最后一单元';
      }

      function renderMainContent() {
        const words = getVisibleWords();

        // Update header title & stats
        if (state.searchResults) {
          els.currentViewTitle.textContent = `搜索：“${state.searchResults.query}”`;
          els.currentViewStats.textContent = `共匹配 ${state.searchResults.total} 词（展示 ${words.length} 词）`;
          els.loadMoreContainer.classList.add('hidden');
        } else if (state.activeView === 'NOTEBOOK') {
          els.currentViewTitle.textContent = '全部生词本';
          els.currentViewStats.textContent = `${words.length} 词`;
        } else if (state.activeView === 'UNMASTERED') {
          els.currentViewTitle.textContent = '未掌握词库';
          els.currentViewStats.textContent = `已加载 ${words.length} / ${state.unmasteredAllKeys.length} 词`;
        } else {
          const unitInfo = splitUnitPage(state.activeView || '');
          els.currentViewTitle.textContent = `${unitInfo.group} · ${unitInfo.label}`;
          const masteredHere = state.currentWords.filter((w) => state.mastered.has(w.word)).length;
          els.currentViewStats.textContent = `${words.length} 词 · 已掌握 ${masteredHere}/${state.currentWords.length}`;
        }

        updateUnitPrevNextControls();

        if (!words.length) {
          els.wordListRoot.innerHTML = `
            <div class="text-center py-20 px-6 bg-paper-card dark:bg-slate-800 rounded-2xl border border-paper-border dark:border-slate-700 shadow-card">
              <div class="w-12 h-12 mx-auto mb-3 rounded-2xl bg-paper-subtle dark:bg-slate-700 flex items-center justify-center text-ink-muted dark:text-slate-400">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
              </div>
              <p class="text-sm font-semibold text-ink-primary dark:text-slate-200">当前视图暂无符合条件的单词</p>
              <p class="text-xs text-ink-muted dark:text-slate-400 mt-1">可以切换顶部的筛选条件，或在左侧选择其他单元继续学习。</p>
            </div>
          `;
          return;
        }

        if (state.viewMode === 'list') {
          renderFastScanList(words);
        } else {
          renderDetailedCards(words);
        }
      }

      function renderExamplesHtml(item) {
        const examples = (item.examples || []).slice().sort((a, b) => (b.y || 0) - (a.y || 0));
        if (!examples.length) {
          return `<p class="text-xs text-ink-muted dark:text-slate-400 py-2">暂无收录真题例句</p>`;
        }

        const activeTag = state.drawerSourceFilter.get(item.word) || '全部';
        const showFilterTabs = examples.length > 5;
        const filtered = activeTag === '全部'
          ? examples
          : examples.filter((ex) => (ex.src || '') === activeTag);

        const tabsHtml = showFilterTabs ? `
          <div class="flex flex-wrap items-center gap-1.5 mb-3">
            ${['全部', '正文', '选项', '题干'].map((tag) => {
              const cnt = tag === '全部' ? examples.length : examples.filter((e) => (e.src || '') === tag).length;
              if (tag !== '全部' && cnt === 0) return '';
              const active = activeTag === tag;
              return `
                <button data-ex-filter="${escapeHtml(tag)}" data-word="${escapeHtml(item.word)}" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold transition-colors ${
                  active
                    ? 'bg-crimson-700 text-white'
                    : 'bg-paper-card dark:bg-slate-800 border border-paper-border dark:border-slate-700 text-ink-muted dark:text-slate-300 hover:border-crimson-700/40'
                }">${tag} (${cnt})</button>
              `;
            }).join('')}
          </div>
        ` : '';

        const listHtml = filtered.map((ex) => `
          <div class="p-3.5 rounded-xl bg-paper-card dark:bg-slate-800/90 border border-paper-border/80 dark:border-slate-700/80 space-y-2">
            <div class="flex items-center justify-between gap-2">
              <div class="flex flex-wrap items-center gap-1.5 text-[11px]">
                ${ex.y ? `<span class="px-2 py-0.5 rounded-md font-semibold bg-crimson-50 text-crimson-800 dark:bg-crimson-900/40 dark:text-crimson-300 tabular-nums">${escapeHtml(ex.y)}</span>` : ''}
                ${ex.t ? `<span class="px-2 py-0.5 rounded-md font-medium bg-paper-subtle text-ink-muted dark:bg-slate-700 dark:text-slate-300">${escapeHtml(({matching:'新题型',heading_matching:'小标题匹配',writing:'写作'})[ex.t] || ex.t)}</span>` : ''}
                ${ex.src ? `<span class="px-2 py-0.5 rounded-md font-medium bg-stone-100 text-stone-600 dark:bg-slate-700/70 dark:text-slate-400">${escapeHtml(ex.src)}</span>` : ''}
              </div>
              <button data-speak-text="${escapeHtml(ex.txt || '')}" title="朗读例句" class="shrink-0 p-1.5 rounded-lg text-ink-muted dark:text-slate-400 hover:bg-paper-subtle dark:hover:bg-slate-700 hover:text-crimson-700 dark:hover:text-crimson-400 transition-colors">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
              </button>
            </div>
            <p class="font-serif text-[15px] leading-relaxed text-ink-primary dark:text-slate-200">${highlightWordInSentence(ex.txt, item.word)}</p>
            <div class="example-translation text-[13px] leading-relaxed text-ink-muted dark:text-slate-400 border-t border-paper-border/60 dark:border-slate-700/60 pt-2 mt-1" data-translate-src="${escapeHtml(ex.txt || '')}"></div>
          </div>
        `).join('');

        return `${tabsHtml}<div class="space-y-2.5">${listHtml || '<p class="text-xs text-ink-muted py-2">该分类下暂无例句</p>'}</div>`;
      }

      function renderDetailedCards(words) {
        const showUnitTag = Boolean(state.searchResults || state.activeView === 'NOTEBOOK' || state.activeView === 'UNMASTERED');

        els.wordListRoot.innerHTML = `
          <div class="space-y-4">
            ${words.map((item, idx) => {
              const isMastered = state.mastered.has(item.word);
              const isNotebook = state.notebook.has(item.word);
              const exCount = (item.examples || []).length;
              const isDrawerOpen = state.allExamplesExpanded || state.expandedDrawers.has(item.word);

              return `
                <article data-word-card="${escapeHtml(item.word)}" class="group bg-paper-card dark:bg-slate-800 border ${
                  isMastered
                    ? 'border-emerald-200/90 dark:border-emerald-800/60 bg-emerald-50/15 dark:bg-slate-800'

                } rounded-2xl shadow-card hover:shadow-card-hover transition-all duration-200 overflow-hidden">

                  <div class="p-4 sm:p-5 space-y-3">
