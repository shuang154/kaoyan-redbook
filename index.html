                    <div class="flex flex-wrap items-start justify-between gap-3">
                      <div class="flex items-center gap-2.5 flex-wrap min-w-0">
                        <span class="text-[11px] font-semibold tabular-nums px-2 py-0.5 rounded-md bg-paper-subtle dark:bg-slate-700 text-ink-muted dark:text-slate-400">
                          #${item.index ?? (idx + 1)}
                        </span>

                        <!-- Headword with optional Mask -->
                        <div data-mask-reveal class="${state.maskWord ? 'mask-active px-2 py-0.5' : ''}" data-mask-label="悬停或点击显示单词">
                          <h3 class="mask-content font-serif text-2xl sm:text-[26px] font-bold tracking-tight ${
                            isMastered ? 'text-emerald-800 dark:text-emerald-300' : 'text-ink-primary dark:text-white'
                          } leading-none">${escapeHtml(item.word)}</h3>
                        </div>

                        <!-- Pronunciation Button -->
                        <button data-speak-text="${escapeHtml(item.word)}" title="朗读单词" class="p-1.5 rounded-full text-ink-muted dark:text-slate-400 hover:bg-paper-subtle dark:hover:bg-slate-700 hover:text-crimson-700 dark:hover:text-crimson-400 transition-colors">
                          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
                        </button>

                        <!-- Exam Frequency Badge -->
                        ${item.count ? `
                          <span class="text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-crimson-50 text-crimson-700 dark:bg-crimson-900/35 dark:text-crimson-300 tabular-nums">
                            真题考频 ${item.count} 次
                          </span>
                        ` : ''}

                        <!-- Source Unit Badge in Search / Virtual Views -->
                        ${showUnitTag && item.page ? `
                          <button data-jump-unit="${escapeHtml(item.page)}" class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-paper-subtle dark:bg-slate-700 text-ink-muted dark:text-slate-300 hover:text-crimson-700 dark:hover:text-crimson-400 transition-colors">
                            ${escapeHtml(item.page)}
                          </button>
                        ` : ''}
                      </div>

                      <!-- Action Buttons: Mastered & Notebook -->
                      <div class="flex items-center gap-1.5 shrink-0">
                        <button data-toggle-mastered="${escapeHtml(item.word)}" class="px-2.5 py-1.5 rounded-xl text-xs font-semibold border transition-all flex items-center gap-1 ${
                          isMastered
                            ? 'bg-emerald-600 border-emerald-600 text-white shadow-sm'
                            : 'bg-paper-card dark:bg-slate-800 border-paper-border dark:border-slate-600 text-ink-muted dark:text-slate-300 hover:border-emerald-500 hover:text-emerald-700 dark:hover:text-emerald-400'
                        }">
                          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                          <span>${isMastered ? '已掌握' : '掌握'}</span>
                        </button>

                        <button data-toggle-notebook="${escapeHtml(item.word)}" class="px-2.5 py-1.5 rounded-xl text-xs font-semibold border transition-all flex items-center gap-1 ${
                          isNotebook
                            ? 'bg-amber-500 border-amber-500 text-white shadow-sm'
                            : 'bg-paper-card dark:bg-slate-800 border-paper-border dark:border-slate-600 text-ink-muted dark:text-slate-300 hover:border-amber-400 hover:text-amber-600 dark:hover:text-amber-300'
                        }">
                          <svg class="w-3.5 h-3.5" fill="${isNotebook ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
                          <span>生词本</span>
                        </button>
                      </div>
                    </div>

                    <!-- Parsed POS Meaning with optional Mask -->
                    <div data-mask-reveal class="${state.maskMeaning ? 'mask-active py-1.5 px-2 -mx-2' : ''}" data-mask-label="悬停或点击查看中文释义">
                      <div class="mask-content text-[15px] leading-relaxed text-ink-primary dark:text-slate-200">
                        ${formatMeaningWithPOS(item.meaning)}
                      </div>
                    </div>

                    <!-- Exam Examples Drawer Toggle -->
                    ${exCount > 0 ? `
                      <div class="pt-1 flex items-center justify-between">
                        <button data-toggle-drawer="${escapeHtml(item.word)}" class="inline-flex items-center gap-1.5 text-xs font-semibold text-crimson-700 dark:text-crimson-400 hover:text-crimson-800 dark:hover:text-crimson-300 py-1 px-2 -ml-2 rounded-lg hover:bg-crimson-50/70 dark:hover:bg-crimson-900/25 transition-colors">
                          <svg class="w-3.5 h-3.5 transition-transform duration-200 ${isDrawerOpen ? 'rotate-180' : ''}" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                          <span>真题例句 (${exCount})</span>
                        </button>
                      </div>
                    ` : ''}
                  </div>

                  <!-- Collapsible Exam Examples Drawer Body -->
                  ${exCount > 0 && isDrawerOpen ? `
                    <div class="px-4 sm:px-5 py-4 bg-paper-subtle/60 dark:bg-slate-900/50 border-t border-paper-border/80 dark:border-slate-700">
                      ${renderExamplesHtml(item)}
                    </div>
                  ` : ''}
                </article>
              `;
            }).join('')}
          </div>
        `;

        // 展开的真题例句才翻译（懒加载），未展开不会产生请求
        translateVisibleExamples();
      }

      function renderFastScanList(words) {
        els.wordListRoot.innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            ${words.map((item) => {
              const isMastered = state.mastered.has(item.word);
              const isNotebook = state.notebook.has(item.word);
              return `
                <div class="bg-paper-card dark:bg-slate-800 border ${
                  isMastered
                    ? 'border-emerald-200/90 dark:border-emerald-800/60'
                    : 'border-paper-border dark:border-slate-700'
                } rounded-xl p-3.5 shadow-card flex flex-col justify-between gap-2.5">
                  <div class="flex items-start justify-between gap-2">
                    <div class="flex items-center gap-2 flex-wrap min-w-0">
                      <div data-mask-reveal class="${state.maskWord ? 'mask-active px-1.5 py-0.5' : ''}" data-mask-label="查看单词">
                        <span class="mask-content font-serif text-xl font-bold ${isMastered ? 'text-emerald-700 dark:text-emerald-300' : 'text-ink-primary dark:text-white'}">${escapeHtml(item.word)}</span>
                      </div>
                      <button data-speak-text="${escapeHtml(item.word)}" class="p-1 rounded-full text-ink-muted dark:text-slate-400 hover:text-crimson-700 dark:hover:text-crimson-400 transition-colors" aria-label="发音">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
                      </button>
                      ${item.count ? `<span class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-crimson-50 text-crimson-700 dark:bg-crimson-900/35 dark:text-crimson-300 tabular-nums">${item.count}次</span>` : ''}
                    </div>
                    <div class="flex items-center gap-1 shrink-0">
                      <button data-toggle-mastered="${escapeHtml(item.word)}" title="标记已掌握" class="p-1.5 rounded-lg border transition-colors ${
                        isMastered
                          ? 'bg-emerald-600 border-emerald-600 text-white'
                          : 'border-paper-border dark:border-slate-600 text-ink-muted dark:text-slate-400 hover:text-emerald-600'
                      }">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                      </button>
                      <button data-toggle-notebook="${escapeHtml(item.word)}" title="加入生词本" class="p-1.5 rounded-lg border transition-colors ${
                        isNotebook
                          ? 'bg-amber-500 border-amber-500 text-white'
                          : 'border-paper-border dark:border-slate-600 text-ink-muted dark:text-slate-400 hover:text-amber-500'
                      }">
                        <svg class="w-3.5 h-3.5" fill="${isNotebook ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
                      </button>
                    </div>
                  </div>
                  <div data-mask-reveal class="${state.maskMeaning ? 'mask-active py-1 px-1.5 -mx-1.5' : ''}" data-mask-label="点击查看释义">
                    <div class="mask-content text-xs leading-relaxed text-ink-muted dark:text-slate-300">
                      ${formatMeaningWithPOS(item.meaning)}
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      /* =====================================================================
       * 12. OPTIMISTIC PROGRESS TOGGLES
       * ===================================================================== */
      function toggleMastered(word) {
        const nextVal = !state.mastered.has(word);
        if (nextVal) state.mastered.add(word);
        else state.mastered.delete(word);

        renderSidebarAndProgress();
        renderMainContent();
        if (state.fcOpen) renderFlashcard();
        apiToggleProgress(word, 'mastered', nextVal);
      }

      function toggleNotebook(word) {
        const nextVal = !state.notebook.has(word);
        if (nextVal) state.notebook.add(word);
        else state.notebook.delete(word);

        renderSidebarAndProgress();
        renderMainContent();
        if (state.fcOpen) renderFlashcard();
        apiToggleProgress(word, 'notebook', nextVal);
      }

      /* =====================================================================
       * 13. INTERACTIVE 3D FLASHCARD MODAL
       * ===================================================================== */
      function openFlashcardModal() {
        const list = getVisibleWords();
        if (!list.length) {
          showToast('当前列表没有可背诵的单词', 'info');
          return;
        }
        state.fcOpen = true;
        state.fcList = list.slice();
        state.fcIndex = 0;
        state.fcFlipped = false;
        els.fcModal.classList.remove('hidden');
        document.body.classList.add('overflow-hidden');
        renderFlashcard();
      }

      function closeFlashcardModal() {
        state.fcOpen = false;
        els.fcModal.classList.add('hidden');
        document.body.classList.remove('overflow-hidden');
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      }

      function renderFlashcard() {
        if (!state.fcList.length) return;
        const item = state.fcList[state.fcIndex];
        const isMastered = state.mastered.has(item.word);
        const isNotebook = state.notebook.has(item.word);

        els.fcCounter.textContent = `${state.fcIndex + 1} / ${state.fcList.length}`;
        els.fcInner.classList.toggle('is-flipped', state.fcFlipped);

        els.fcUnitBadge.textContent = item.page || '';
        els.fcFreqBadge.textContent = item.count ? `真题考频 ${item.count} 次` : '核心词汇';
        els.fcWord.textContent = item.word;
        els.fcBackWord.textContent = item.word;
        els.fcBackFreq.textContent = item.count ? `考频 ${item.count} 次` : '';

        els.fcStatusBadges.innerHTML = `
          ${isMastered ? '<span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300">已掌握</span>' : ''}
          ${isNotebook ? '<span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300">生词本</span>' : ''}
        `;

        els.fcMeaning.innerHTML = formatMeaningWithPOS(item.meaning);

        const topExamples = (item.examples || []).slice().sort((a, b) => (b.y || 0) - (a.y || 0)).slice(0, 2);
        els.fcExamples.innerHTML = topExamples.length
          ? topExamples.map((ex) => `
              <div class="p-3 rounded-xl bg-paper-subtle/75 dark:bg-slate-900/60 border border-paper-border dark:border-slate-700">
                <div class="flex items-center gap-1.5 text-[11px] text-ink-muted dark:text-slate-400 mb-1">
                  ${ex.y ? `<span class="font-semibold text-crimson-700 dark:text-crimson-400">${escapeHtml(ex.y)}</span>` : ''}
                  ${ex.t ? `<span>${escapeHtml(ex.t)}</span>` : ''}
                  ${ex.src ? `<span class="opacity-70">· ${escapeHtml(ex.src)}</span>` : ''}
                </div>
                <p class="font-serif text-sm leading-relaxed text-ink-primary dark:text-slate-200">${highlightWordInSentence(ex.txt, item.word)}</p>
              </div>
            `).join('')
          : '<p class="text-xs text-ink-muted dark:text-slate-400">暂无收录真题例句</p>';

        els.fcMasteredText.textContent = isMastered ? '取消掌握' : '已掌握';
        els.fcNotebookText.textContent = isNotebook ? '移出生词' : '生词本';
      }

      function fcStep(delta) {
        if (!state.fcList.length) return;
        state.fcIndex = (state.fcIndex + delta + state.fcList.length) % state.fcList.length;
        state.fcFlipped = false;
        renderFlashcard();
      }

      /* =====================================================================
       * 14. MOBILE SIDEBAR DRAWER HELPERS
       * ===================================================================== */
      function openMobileSidebar() {
        els.sidebar.classList.remove('-translate-x-full');
        els.mobileBackdrop.classList.remove('hidden');
      }

      function closeMobileSidebar() {
        els.sidebar.classList.add('-translate-x-full');
        els.mobileBackdrop.classList.add('hidden');
      }

      /* =====================================================================
       * 15. EVENT BINDINGS
       * ===================================================================== */
      function bindEvents() {
        // Mobile drawer
        els.btnOpenSidebar.addEventListener('click', openMobileSidebar);
        els.btnCloseSidebar.addEventListener('click', closeMobileSidebar);
        els.mobileBackdrop.addEventListener('click', closeMobileSidebar);

        // Quick smart views
        document.querySelectorAll('.nav-item[data-nav-view]').forEach((btn) => {
          btn.addEventListener('click', () => {
            if (btn.dataset.navView === 'NOTEBOOK') openNotebookView();
            else if (btn.dataset.navView === 'UNMASTERED') openUnmasteredView();
          });
        });

        // Sidebar unit tree delegation
        els.unitNavContainer.addEventListener('click', (e) => {
          const groupBtn = e.target.closest('[data-toggle-group]');
          if (groupBtn) {
            const g = groupBtn.dataset.toggleGroup;
            if (state.collapsedGroups.has(g)) state.collapsedGroups.delete(g);
            else state.collapsedGroups.add(g);
            renderSidebarAndProgress();
            return;
          }
          const unitBtn = e.target.closest('[data-select-unit]');
          if (unitBtn) {
            openUnit(unitBtn.dataset.selectUnit);
          }
        });

        // Prev / Next Unit navigation
        const goRelativeUnit = (delta) => {
          const idx = state.unitOrder.indexOf(state.activeView);
          if (idx === -1) return;
          const nextIdx = idx + delta;
          if (nextIdx >= 0 && nextIdx < state.unitOrder.length) {
            openUnit(state.unitOrder[nextIdx]);
          }
        };
        els.btnPrevUnit.addEventListener('click', () => goRelativeUnit(-1));
        els.btnNextUnit.addEventListener('click', () => goRelativeUnit(1));
        els.btnFooterPrev.addEventListener('click', () => goRelativeUnit(-1));
        els.btnFooterNext.addEventListener('click', () => goRelativeUnit(1));

        // Load More Unmastered chunk
        els.btnLoadMore.addEventListener('click', loadNextUnmasteredChunk);

        // View mode switcher
        els.modeCard.addEventListener('click', () => {
          state.viewMode = 'card';
          updateToolbarControls();
          renderMainContent();
        });
        els.modeList.addEventListener('click', () => {
          state.viewMode = 'list';
          updateToolbarControls();
          renderMainContent();
        });
        els.btnOpenFlashcard.addEventListener('click', openFlashcardModal);

        // Self-test masks
        els.btnMaskMeaning.addEventListener('click', () => {
          state.maskMeaning = !state.maskMeaning;
          updateToolbarControls();
          renderMainContent();
        });
        els.btnMaskWord.addEventListener('click', () => {
          state.maskWord = !state.maskWord;
          updateToolbarControls();
          renderMainContent();
        });

        // Voice accent toggle
        els.btnAccentToggle.addEventListener('click', () => {
          const nextAccent = state.settings.accent === 'en-GB' ? 'en-US' : 'en-GB';
          apiSaveSettings({ accent: nextAccent });
          updateToolbarControls();
          showToast(`已切换为${nextAccent === 'en-GB' ? '英式发音' : '美式发音'}`);
        });

        // Dark mode toggle
        els.btnThemeToggle.addEventListener('click', () => {
          const nextDark = !state.settings.darkMode;
          apiSaveSettings({ darkMode: nextDark });
          applyTheme();
        });

        // Filter pills
        els.filterPills.addEventListener('click', (e) => {
          const pill = e.target.closest('[data-filter]');
          if (!pill) return;
          state.filter = pill.dataset.filter;
          updateToolbarControls();
          renderMainContent();
        });

        // Expand / Collapse all examples
        els.btnToggleAllExamples.addEventListener('click', () => {
          state.allExamplesExpanded = !state.allExamplesExpanded;
          if (!state.allExamplesExpanded) state.expandedDrawers.clear();
          updateToolbarControls();
          renderMainContent();
        });

        // Debounced Global Search (300ms)
        let searchTimer = null;
        els.searchInput.addEventListener('input', (e) => {
          const q = e.target.value.trim();
          state.searchQuery = q;
          els.btnClearSearch.classList.toggle('hidden', !q);

          clearTimeout(searchTimer);
          if (!q) {
            state.searchResults = null;
            els.searchSpinner.classList.add('hidden');
            renderSidebarAndProgress();
            renderMainContent();
            return;
          }

          els.searchSpinner.classList.remove('hidden');
          searchTimer = setTimeout(async () => {
            try {
              const res = await apiSearch(q);
              if (state.searchQuery !== q) return;
              state.searchResults = res;
              renderSidebarAndProgress();
              renderMainContent();
            } catch (err) {
              showToast('搜索请求失败', 'error');
            } finally {
              els.searchSpinner.classList.add('hidden');
            }
          }, 300);
        });

        els.btnClearSearch.addEventListener('click', () => {
          els.searchInput.value = '';
          state.searchQuery = '';
          state.searchResults = null;
          els.btnClearSearch.classList.add('hidden');
          renderSidebarAndProgress();
          renderMainContent();
          els.searchInput.focus();
        });

        // Main word area delegation (speak, mastered, notebook, drawer, filter tabs, mask click-reveal, unit jump)
        els.wordListRoot.addEventListener('click', (e) => {
          const speakBtn = e.target.closest('[data-speak-text]');
          if (speakBtn) {
            e.stopPropagation();
            speakText(speakBtn.dataset.speakText, speakBtn);
            return;
          }

          const masterBtn = e.target.closest('[data-toggle-mastered]');
          if (masterBtn) {
            e.stopPropagation();
            toggleMastered(masterBtn.dataset.toggleMastered);
            return;
          }

          const noteBtn = e.target.closest('[data-toggle-notebook]');
          if (noteBtn) {
            e.stopPropagation();
            toggleNotebook(noteBtn.dataset.toggleNotebook);
            return;
          }

          const drawerBtn = e.target.closest('[data-toggle-drawer]');
          if (drawerBtn) {
            const w = drawerBtn.dataset.toggleDrawer;
            if (state.allExamplesExpanded) {
              // Switch out of global expand mode while collapsing this specific drawer
              state.allExamplesExpanded = false;
              getVisibleWords().forEach((item) => {
                if (item.word !== w) state.expandedDrawers.add(item.word);
              });
              updateToolbarControls();
            } else if (state.expandedDrawers.has(w)) {
              state.expandedDrawers.delete(w);
            } else {
              state.expandedDrawers.add(w);
            }
            renderMainContent();
            return;
          }

          const exFilterBtn = e.target.closest('[data-ex-filter]');
          if (exFilterBtn) {
            state.drawerSourceFilter.set(exFilterBtn.dataset.word, exFilterBtn.dataset.exFilter);
            renderMainContent();
            return;
          }

          const jumpBtn = e.target.closest('[data-jump-unit]');
          if (jumpBtn) {
            openUnit(jumpBtn.dataset.jumpUnit);
            return;
          }

          const maskEl = e.target.closest('[data-mask-reveal].mask-active');
          if (maskEl) {
            maskEl.classList.toggle('revealed');
          }
        });

        // Export Progress JSON
        els.btnExportProgress.addEventListener('click', () => {
          const payload = {
            exportedAt: new Date().toISOString(),
            mastered: Array.from(state.mastered),
            notebook: Array.from(state.notebook),
          };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `redbook-progress-${new Date().toISOString().slice(0, 10)}.json`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          showToast('进度文件已导出', 'success');
        });

        // Import Progress JSON -> POST ./api/progress/batch (merge)
        els.inputProgressUpload.addEventListener('change', async (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          try {
            const text = await file.text();
            const parsed = JSON.parse(text);
            const mastered = Array.isArray(parsed.mastered) ? parsed.mastered : [];
            const notebook = Array.isArray(parsed.notebook) ? parsed.notebook : [];
            if (!mastered.length && !notebook.length) {
              showToast('文件中未找到可导入的进度记录', 'error');
              return;
            }
            await apiBatchImport(mastered, notebook);
            renderSidebarAndProgress();
            renderMainContent();
            showToast(`已合并导入 ${mastered.length} 个已掌握词、${notebook.length} 个生词`, 'success');
          } catch (err) {
            console.error('Import error:', err);
            showToast('进度文件格式无效或同步失败', 'error');
          } finally {
            e.target.value = '';
          }
        });

        // Flashcard Modal Events
        els.fcClose.addEventListener('click', closeFlashcardModal);
        els.fcStage.addEventListener('click', (e) => {
          if (e.target.closest('button')) return;
          state.fcFlipped = !state.fcFlipped;
          els.fcInner.classList.toggle('is-flipped', state.fcFlipped);
        });
        els.fcSpeak.addEventListener('click', (e) => {
          e.stopPropagation();
          const item = state.fcList[state.fcIndex];
          if (item) speakText(item.word, els.fcSpeak);
        });
        els.fcBackSpeak.addEventListener('click', (e) => {
          e.stopPropagation();
          const item = state.fcList[state.fcIndex];
          if (item) speakText(item.word, els.fcBackSpeak);
        });
        els.fcPrev.addEventListener('click', () => fcStep(-1));
        els.fcNext.addEventListener('click', () => fcStep(1));
        els.fcToggleMastered.addEventListener('click', () => {
          const item = state.fcList[state.fcIndex];
          if (item) toggleMastered(item.word);
        });
        els.fcToggleNotebook.addEventListener('click', () => {
          const item = state.fcList[state.fcIndex];
          if (item) toggleNotebook(item.word);
        });
        els.fcShuffle.addEventListener('click', () => {
          for (let i = state.fcList.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [state.fcList[i], state.fcList[j]] = [state.fcList[j], state.fcList[i]];
          }
          state.fcIndex = 0;
          state.fcFlipped = false;
          renderFlashcard();
          showToast('已打乱当前闪卡顺序');
        });

        // Flashcard Touch Swipe Support
        let touchStartX = 0;
        let touchStartY = 0;
        els.fcStage.addEventListener('touchstart', (e) => {
          if (!e.touches.length) return;
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        }, { passive: true });
        els.fcStage.addEventListener('touchend', (e) => {
          if (!e.changedTouches.length) return;
          const dx = e.changedTouches[0].clientX - touchStartX;
          const dy = e.changedTouches[0].clientY - touchStartY;
          if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
            fcStep(dx < 0 ? 1 : -1);
          }
        }, { passive: true });

        // Flashcard Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
          if (!state.fcOpen) return;
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

          if (e.code === 'Space') {
            e.preventDefault();
            state.fcFlipped = !state.fcFlipped;
            els.fcInner.classList.toggle('is-flipped', state.fcFlipped);
          } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            fcStep(-1);
          } else if (e.key === 'ArrowRight') {
            e.preventDefault();
            fcStep(1);
          } else if (e.key === '1') {
            e.preventDefault();
            const item = state.fcList[state.fcIndex];
            if (item) toggleMastered(item.word);
          } else if (e.key === '2') {
            e.preventDefault();
            const item = state.fcList[state.fcIndex];
            if (item) toggleNotebook(item.word);
          } else if (e.key === 's' || e.key === 'S') {
            e.preventDefault();
            const item = state.fcList[state.fcIndex];
            if (item) speakText(item.word);
          } else if (e.key === 'Escape') {
            e.preventDefault();
            closeFlashcardModal();
          }
        });
      }

      /* =====================================================================
       * 16. BOOTSTRAP
       * ===================================================================== */
      async function init() {
        bindEvents();
        await apiLoadInitial();
        applyTheme();
        renderSidebarAndProgress();
        updateToolbarControls();

        // Open saved lastUnit if valid, otherwise the first unit
        const initialUnit =
          state.settings.lastUnit && state.unitOrder.includes(state.settings.lastUnit)
            ? state.settings.lastUnit
            : state.unitOrder[0];

        if (initialUnit) {
          await openUnit(initialUnit, false);
        }
      }

      window.addEventListener('DOMContentLoaded', init);
    })();
  </script>
</body>
</html>
